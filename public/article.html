<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

<title>Believe Feel Become | Stories on Mind, Body & Growth</title>
<link rel="icon" type="image/png" href="/favicon.png">

  <meta name="description" content="Read stories and reflections on mindset, discipline, the body, personal growth and the journey of becoming.">

  <style>
    :root {
      --bg: #070707;
      --surface: #0b0b0b;
      --text: #f4f4f1;
      --muted: #858585;
      --dim: #4d4d4d;
      --line: rgba(255,255,255,0.10);
      --accent: #d8ff5f;
      --content-width: 820px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.7;

      overflow-x: hidden;
    }

    /* -------------------------
       GRAIN
    ------------------------- */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: 0.035;

      z-index: 999;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    }

    /* -------------------------
       NAVIGATION
    ------------------------- */

    .nav {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 82px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 5vw;

      z-index: 100;

      background:
        linear-gradient(
          to bottom,
          rgba(7,7,7,0.95),
          rgba(7,7,7,0)
        );

      backdrop-filter: blur(10px);
    }

    .logo {
      color: white;

      text-decoration: none;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      transition: opacity 0.3s ease;
    }

    .logo:hover {
      opacity: 0.65;
    }

    .back {
      color: #777;

      text-decoration: none;

      font-size: 10px;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      display: flex;

      align-items: center;

      gap: 10px;

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .back:hover {
      color: white;

      transform: translateX(-4px);
    }

    /* -------------------------
       HERO
    ------------------------- */

    .article-hero {
      min-height: 92vh;

      display: flex;

      align-items: flex-end;

      padding:
        160px 7vw
        95px;

      position: relative;

      overflow: hidden;
    }

    .hero-background {
      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at 72% 28%,
          rgba(255,255,255,0.065),
          transparent 30%
        ),
        radial-gradient(
          circle at 18% 80%,
          rgba(216,255,95,0.055),
          transparent 32%
        );

      pointer-events: none;

      animation:
        backgroundPulse 8s ease-in-out infinite;
    }

    .hero-background::before {
      content: "";

      position: absolute;

      width: 600px;
      height: 600px;

      right: -250px;
      top: 5%;

      border-radius: 50%;

      border: 1px solid rgba(216,255,95,0.045);
    }

    .hero-background::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(7,7,7,0.02),
          rgba(7,7,7,0.35) 58%,
          #070707 100%
        );
    }

    .hero-content {
      position: relative;

      z-index: 2;

      max-width: 1250px;

      width: 100%;

      margin: 0 auto;
    }

    .category {
      display: flex;

      align-items: center;

      gap: 13px;

      color: var(--accent);

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.24em;

      text-transform: uppercase;

      margin-bottom: 30px;
    }

    .category::before {
      content: "";

      width: 35px;
      height: 1px;

      background: var(--accent);
    }

    .article-title {
      max-width: 1150px;

      font-size:
        clamp(50px, 8vw, 120px);

      line-height: 0.91;

      letter-spacing: -0.07em;

      font-weight: 700;

      margin-bottom: 40px;
    }

    .excerpt {
      max-width: 720px;

      font-size:
        clamp(18px, 2vw, 26px);

      line-height: 1.45;

      color: #9b9b9b;

      font-weight: 300;

      letter-spacing: -0.02em;
    }

    /* -------------------------
       META
    ------------------------- */

    .article-meta {
      max-width: var(--content-width);

      margin: 0 auto;

      padding:
        30px 25px;

      border-top: 1px solid var(--line);

      border-bottom: 1px solid var(--line);

      display: flex;

      justify-content: space-between;

      color: #555;

      font-size: 9px;

      letter-spacing: 0.18em;

      text-transform: uppercase;
    }

    /* -------------------------
       FEATURE IMAGE
    ------------------------- */

    .featured-image-wrapper {
      width: min(1250px, 90vw);

      margin:
        80px auto
        115px;

      position: relative;

      overflow: hidden;

      background: #101010;
    }

    .featured-image-wrapper::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          transparent 55%,
          rgba(216,255,95,0.06)
        );
    }

    .featured-image {
      width: 100%;

      display: block;

      max-height: 760px;

      object-fit: cover;

      filter:
        brightness(0.82)
        saturate(0.88);

      transition:
        transform 1.2s cubic-bezier(.2,.7,.2,1),
        filter 0.8s ease;
    }

    .featured-image-wrapper:hover
    .featured-image {
      transform: scale(1.025);

      filter:
        brightness(0.96)
        saturate(1);
    }

    /* -------------------------
       ARTICLE CONTENT
    ------------------------- */

    .article-body {
      max-width: var(--content-width);

      margin: 0 auto;

      padding:
        0 25px
        110px;
    }

    .article-body p {
      font-size: 19px;

      line-height: 1.95;

      color: #c4c4c4;

      margin-bottom: 32px;

      font-weight: 350;
    }

    .article-body h2 {
      position: relative;

      font-size:
        clamp(34px, 5vw, 58px);

      line-height: 1;

      letter-spacing: -0.055em;

      margin:
        90px 0 32px;

      color: white;
    }

    .article-body h2::before {
      content: "";

      display: block;

      width: 28px;
      height: 2px;

      background: var(--accent);

      margin-bottom: 20px;
    }

    .article-body h3 {
      font-size: 28px;

      line-height: 1.1;

      letter-spacing: -0.03em;

      margin:
        60px 0 22px;

      color: white;
    }

    .article-body blockquote {
      margin:
        70px 0;

      padding:
        25px 0
        25px 32px;

      border-left:
        2px solid var(--accent);

      font-size:
        clamp(25px, 4vw, 40px);

      line-height: 1.25;

      color: white;

      font-weight: 500;

      letter-spacing: -0.035em;
    }

    .article-body strong {
      color: white;

      font-weight: 600;
    }

    .article-body em {
      color: #ddd;
    }

    /* -------------------------
       FOOTER
    ------------------------- */

    .article-footer {
      border-top: 1px solid var(--line);

      max-width: 1200px;

      margin: 0 auto;

      padding:
        90px 25px
        110px;

      text-align: center;
    }

    .footer-small {
      color: #555;

      font-size: 9px;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      margin-bottom: 30px;
    }

    .footer-quote {
      font-size:
        clamp(30px, 5vw, 58px);

      line-height: 0.95;

      letter-spacing: -0.055em;

      max-width: 800px;

      margin: 0 auto;
    }

    .home-button {
      display: inline-flex;

      align-items: center;

      gap: 12px;

      margin-top: 48px;

      color: white;

      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.20);

      padding:
        14px 23px;

      font-size: 10px;

      letter-spacing: 0.17em;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease;
    }

    .home-button::after {
      content: "→";

      font-size: 14px;
    }

    .home-button:hover {
      background: var(--accent);

      color: #080808;

      border-color: var(--accent);
    }

    /* -------------------------
       ANIMATIONS
    ------------------------- */

    .reveal {
      opacity: 0;

      transform: translateY(35px);

      animation:
        reveal 1s
        cubic-bezier(.2,.7,.2,1)
        forwards;
    }

    .delay-1 {
      animation-delay: 0.15s;
    }

    .delay-2 {
      animation-delay: 0.3s;
    }

    @keyframes reveal {

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    @keyframes backgroundPulse {

      0%, 100% {
        opacity: 0.75;
      }

      50% {
        opacity: 1;
      }
    }

    /* -------------------------
       MOBILE
    ------------------------- */

    @media (max-width: 700px) {

      .nav {
        height: 64px;

        padding:
          0 22px;
      }

      .logo {
        font-size: 9px;
      }

      .back {
        font-size: 9px;
      }

      .article-hero {
        min-height: 82vh;

        padding:
          125px 24px
          70px;
      }

      .article-title {
        font-size:
          clamp(45px, 14vw, 78px);

        line-height: 0.92;
      }

      .excerpt {
        font-size: 18px;

        line-height: 1.5;
      }

      .article-meta {
        margin:
          0 24px;

        padding:
          25px 0;

        flex-direction: column;

        gap: 9px;

        line-height: 1.5;
      }

      .featured-image-wrapper {
        width: 100%;

        margin:
          50px 0
          75px;
      }

      .article-body {
        padding:
          0 24px
          75px;
      }

      .article-body p {
        font-size: 17px;

        line-height: 1.85;
      }

      .article-body h2 {
        margin-top: 65px;
      }

      .article-body blockquote {
        padding-left: 22px;

        margin:
          55px 0;
      }

      .article-footer {
        padding:
          70px 24px
          85px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
      }
    }
  </style>

</head>

<body>

  <!-- NAVIGATION -->

  <nav class="nav">

    <a
      href="/"
      class="logo"
    >
      THE BODY KNOWS
    </a>

    <a
      href="/"
      class="back"
    >
      ← Back
    </a>

  </nav>


  <!-- HERO -->

  <header class="article-hero">

    <div class="hero-background"></div>

    <div class="hero-content">

      <div
        id="category"
        class="category reveal"
      >
        STORY
      </div>

      <h1
        id="title"
        class="article-title reveal delay-1"
      >
        Loading...
      </h1>

      <p
        id="excerpt"
        class="excerpt reveal delay-2"
      ></p>

    </div>

  </header>


  <!-- META -->

  <div class="article-meta">

    <span id="date">
      —
    </span>

    <span>
      THE BODY KNOWS WHAT THE MIND FEELS
    </span>

  </div>


  <!-- FEATURE IMAGE -->

  <div
    id="imageWrapper"
    class="featured-image-wrapper"
    style="display:none;"
  >

    <img
      id="featuredImage"
      class="featured-image"
      alt=""
    >

  </div>


  <!-- ARTICLE -->

  <main
    id="content"
    class="article-body"
  >
  </main>


  <!-- FOOTER -->

  <footer class="article-footer">

    <div class="footer-small">
      The journey is the story.
    </div>

    <div class="footer-quote">
      Believe It.<br>
      Feel It.<br>
      Become It.
    </div>

    <a
      href="/"
      class="home-button"
    >
      Read More Stories
    </a>

  </footer>


  <script>

    // -------------------------
    // GET ARTICLE SLUG
    // -------------------------

    const params =
      new URLSearchParams(
        window.location.search
      );

    const slug =
      params.get("slug");


    // -------------------------
    // FORMAT DATE
    // -------------------------

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date =
        new Date(dateString);

      return date.toLocaleDateString(
        "en-CA",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );
    }


    // -------------------------
    // RENDER ARTICLE CONTENT
    // -------------------------

    function renderContent(text) {

      if (!text) {
        return "";
      }

      const lines =
        text.split(/\r?\n/);

      let html = "";

      let paragraph = [];


      function flushParagraph() {

        if (paragraph.length === 0) {
          return;
        }

        const text =
          paragraph.join(" ");

        html +=
          `<p>${escapeHtml(text)}</p>`;

        paragraph = [];
      }


      for (const line of lines) {

        const trimmed =
          line.trim();


        if (!trimmed) {

          flushParagraph();

          continue;
        }


        if (trimmed.startsWith("## ")) {

          flushParagraph();

          html +=
            `<h2>${escapeHtml(
              trimmed.substring(3)
            )}</h2>`;

          continue;
        }


        if (trimmed.startsWith("### ")) {

          flushParagraph();

          html +=
            `<h3>${escapeHtml(
              trimmed.substring(4)
            )}</h3>`;

          continue;
        }


        if (trimmed.startsWith("> ")) {

          flushParagraph();

          html +=
            `<blockquote>${escapeHtml(
              trimmed.substring(2)
            )}</blockquote>`;

          continue;
        }


        paragraph.push(trimmed);
      }


      flushParagraph();

      return html;
    }


    // -------------------------
    // SECURITY
    // -------------------------

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // -------------------------
    // LOAD ARTICLE
    // -------------------------

    async function loadArticle() {

      if (!slug) {

        document.getElementById("title")
          .textContent =
          "Article not found.";

        return;
      }


      try {

        const response =
          await fetch(
            `/api/articles/${encodeURIComponent(slug)}`
          );


        if (!response.ok) {

          throw new Error(
            "Article not found"
          );
        }


        const article =
          await response.json();


        document.title =
          `${article.title} — The Body Knows What The Mind Feels`;

const metaDescription = document.querySelector('meta[name="description"]');

if (metaDescription) {
  metaDescription.setAttribute(
    "content",
    article.excerpt || "Stories and reflections on mindset, discipline, the body, personal growth and the journey of becoming."
  );
}
        document.getElementById(
          "category"
        ).textContent =
          article.category || "STORY";


        document.getElementById(
          "title"
        ).textContent =
          article.title;


        document.getElementById(
          "excerpt"
        ).textContent =
          article.excerpt || "";


        document.getElementById(
          "date"
        ).textContent =
          formatDate(
            article.created_at
          );


        document.getElementById(
          "content"
        ).innerHTML =
          renderContent(
            article.content
          );


        if (article.image_url) {

          const wrapper =
            document.getElementById(
              "imageWrapper"
            );

          const image =
            document.getElementById(
              "featuredImage"
            );


          image.src =
            article.image_url;


          image.alt =
            article.title;


          wrapper.style.display =
            "block";
        }

      } catch (error) {

        console.error(error);

        document.getElementById(
          "title"
        ).textContent =
          "Article not found.";

        document.getElementById(
          "excerpt"
        ).textContent =
          "The article could not be loaded.";
      }
    }


    loadArticle();

  </script>

</body>
</html>

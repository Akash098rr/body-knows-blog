<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Body Knows What The Mind Feels</title>

  <meta
    name="description"
    content="The Body Knows What The Mind Feels — personal stories about mind, body, growth and life."
  >

  <style>
    :root {
      --background: #080808;
      --text: #f5f5f5;
      --muted: #999;
      --line: rgba(255,255,255,0.12);
      --accent: #d8ff5f;
      --content-width: 820px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.7;
      overflow-x: hidden;
    }

    /* -------------------------
       NAVIGATION
    ------------------------- */

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5vw;

      z-index: 100;

      background: linear-gradient(
        to bottom,
        rgba(8,8,8,0.95),
        rgba(8,8,8,0)
      );

      backdrop-filter: blur(8px);
    }

    .logo {
      color: white;
      text-decoration: none;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .back {
      color: #aaa;
      text-decoration: none;

      font-size: 13px;
      letter-spacing: 0.08em;

      transition: color 0.3s ease;
    }

    .back:hover {
      color: white;
    }

    /* -------------------------
       HERO
    ------------------------- */

    .article-hero {
      min-height: 92vh;

      display: flex;
      align-items: flex-end;

      padding:
        150px 7vw
        90px;

      position: relative;

      overflow: hidden;
    }

    .hero-background {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(255,255,255,0.07),
          transparent 35%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(216,255,95,0.05),
          transparent 35%
        );

      pointer-events: none;
    }

    .hero-background::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(8,8,8,0.05),
          rgba(8,8,8,0.4) 60%,
          #080808 100%
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 1200px;
      width: 100%;

      margin: 0 auto;
    }

    .category {
      display: inline-block;

      color: var(--accent);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.2em;
      text-transform: uppercase;

      margin-bottom: 28px;
    }

    .article-title {
      max-width: 1100px;

      font-size:
        clamp(48px, 8vw, 112px);

      line-height: 0.94;

      letter-spacing: -0.055em;

      font-weight: 700;

      margin-bottom: 38px;
    }

    .excerpt {
      max-width: 700px;

      font-size:
        clamp(18px, 2vw, 25px);

      line-height: 1.45;

      color: #bcbcbc;

      font-weight: 300;
    }

    /* -------------------------
       META
    ------------------------- */

    .article-meta {
      max-width: var(--content-width);

      margin: 0 auto;

      padding:
        35px 25px;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      display: flex;

      justify-content: space-between;

      color: #777;

      font-size: 12px;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }

    /* -------------------------
       FEATURE IMAGE
    ------------------------- */

    .featured-image-wrapper {
      width: min(1200px, 90vw);

      margin:
        80px auto
        100px;

      position: relative;

      overflow: hidden;

      background: #111;
    }

    .featured-image {
      width: 100%;

      display: block;

      max-height: 720px;

      object-fit: cover;

      transition:
        transform 1.2s cubic-bezier(.2,.7,.2,1);
    }

    .featured-image-wrapper:hover
    .featured-image {
      transform: scale(1.025);
    }

    /* -------------------------
       ARTICLE CONTENT
    ------------------------- */

    .article-body {
      max-width: var(--content-width);

      margin: 0 auto;

      padding:
        0 25px
        100px;
    }

    .article-body p {
      font-size: 19px;

      line-height: 1.9;

      color: #c8c8c8;

      margin-bottom: 30px;

      font-weight: 350;
    }

    .article-body h2 {
      font-size:
        clamp(32px, 5vw, 55px);

      line-height: 1.05;

      letter-spacing: -0.04em;

      margin:
        80px 0 30px;

      color: white;
    }

    .article-body h3 {
      font-size: 28px;

      margin:
        55px 0 20px;

      color: white;
    }

    .article-body blockquote {
      margin:
        65px 0;

      padding:
        25px 0
        25px 35px;

      border-left:
        2px solid var(--accent);

      font-size:
        clamp(24px, 4vw, 38px);

      line-height: 1.3;

      color: white;

      font-weight: 500;

      letter-spacing: -0.02em;
    }

    .article-body strong {
      color: white;
      font-weight: 600;
    }

    .article-body em {
      color: #ddd;
    }

    /* -------------------------
       FOOTER
    ------------------------- */

    .article-footer {
      border-top: 1px solid var(--line);

      max-width: 1200px;

      margin: 0 auto;

      padding:
        80px 25px
        100px;

      text-align: center;
    }

    .footer-small {
      color: #666;

      font-size: 11px;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      margin-bottom: 25px;
    }

    .footer-quote {
      font-size:
        clamp(28px, 5vw, 55px);

      line-height: 1;

      letter-spacing: -0.04em;

      max-width: 800px;

      margin: 0 auto;
    }

    .home-button {
      display: inline-block;

      margin-top: 45px;

      color: white;

      text-decoration: none;

      border: 1px solid rgba(255,255,255,0.25);

      padding:
        13px 22px;

      font-size: 12px;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    .home-button:hover {
      background: white;
      color: black;
    }

    /* -------------------------
       ANIMATIONS
    ------------------------- */

    .reveal {
      opacity: 0;

      transform: translateY(35px);

      animation:
        reveal 1s
        cubic-bezier(.2,.7,.2,1)
        forwards;
    }

    .delay-1 {
      animation-delay: 0.15s;
    }

    .delay-2 {
      animation-delay: 0.3s;
    }

    .delay-3 {
      animation-delay: 0.45s;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* -------------------------
       MOBILE
    ------------------------- */

    @media (max-width: 700px) {

      .nav {
        height: 64px;
        padding: 0 22px;
      }

      .logo {
        font-size: 10px;
      }

      .back {
        font-size: 11px;
      }

      .article-hero {
        min-height: 82vh;

        padding:
          130px 24px
          65px;
      }

      .article-title {
        font-size:
          clamp(45px, 14vw, 75px);
      }

      .excerpt {
        font-size: 18px;
      }

      .article-meta {
        margin: 0 24px;
        padding: 25px 0;

        flex-direction: column;

        gap: 8px;
      }

      .featured-image-wrapper {
        width: 100%;
        margin:
          50px 0
          70px;
      }

      .article-body {
        padding:
          0 24px
          70px;
      }

      .article-body p {
        font-size: 17px;
        line-height: 1.8;
      }

      .article-body h2 {
        margin-top: 60px;
      }

      .article-body blockquote {
        padding-left: 22px;
        margin: 50px 0;
      }

      .article-footer {
        padding:
          65px 24px
          80px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav class="nav">

    <a
      href="/"
      class="logo"
    >
      THE BODY KNOWS
    </a>

    <a
      href="/"
      class="back"
    >
      ← Back
    </a>

  </nav>


  <!-- HERO -->

  <header class="article-hero">

    <div class="hero-background"></div>

    <div class="hero-content">

      <div
        id="category"
        class="category reveal"
      >
        STORY
      </div>

      <h1
        id="title"
        class="article-title reveal delay-1"
      >
        Loading...
      </h1>

      <p
        id="excerpt"
        class="excerpt reveal delay-2"
      ></p>

    </div>

  </header>


  <!-- META -->

  <div class="article-meta">

    <span id="date">
      —
    </span>

    <span>
      THE BODY KNOWS WHAT THE MIND FEELS
    </span>

  </div>


  <!-- FEATURE IMAGE -->

  <div
    id="imageWrapper"
    class="featured-image-wrapper"
    style="display:none;"
  >

    <img
      id="featuredImage"
      class="featured-image"
      alt=""
    >

  </div>


  <!-- ARTICLE -->

  <main
    id="content"
    class="article-body"
  >
  </main>


  <!-- FOOTER -->

  <footer class="article-footer">

    <div class="footer-small">
      The journey is the story.
    </div>

    <div class="footer-quote">
      Believe It.<br>
      Feel It.<br>
      Become It.
    </div>

    <a
      href="/"
      class="home-button"
    >
      Read More Stories
    </a>

  </footer>


  <script>

    // -------------------------
    // GET ARTICLE SLUG
    // -------------------------

    const params =
      new URLSearchParams(
        window.location.search
      );

    const slug =
      params.get("slug");


    // -------------------------
    // FORMAT DATE
    // -------------------------

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date =
        new Date(dateString);

      return date.toLocaleDateString(
        "en-CA",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );
    }


    // -------------------------
    // RENDER ARTICLE CONTENT
    // -------------------------

    function renderContent(text) {

      if (!text) {
        return "";
      }

      const lines =
        text.split(/\r?\n/);

      let html = "";

      let paragraph = [];


      function flushParagraph() {

        if (paragraph.length === 0) {
          return;
        }

        const text =
          paragraph.join(" ");

        html += `<p>${escapeHtml(text)}</p>`;

        paragraph = [];
      }


      for (const line of lines) {

        const trimmed =
          line.trim();


        // Empty line
        if (!trimmed) {
          flushParagraph();
          continue;
        }


        // Heading
        if (trimmed.startsWith("## ")) {

          flushParagraph();

          html +=
            `<h2>${escapeHtml(
              trimmed.substring(3)
            )}</h2>`;

          continue;
        }


        // Small heading
        if (trimmed.startsWith("### ")) {

          flushParagraph();

          html +=
            `<h3>${escapeHtml(
              trimmed.substring(4)
            )}</h3>`;

          continue;
        }


        // Quote
        if (trimmed.startsWith("> ")) {

          flushParagraph();

          html +=
            `<blockquote>${escapeHtml(
              trimmed.substring(2)
            )}</blockquote>`;

          continue;
        }


        paragraph.push(trimmed);
      }


      flushParagraph();

      return html;
    }


    // -------------------------
    // SECURITY
    // -------------------------

    function escapeHtml(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // -------------------------
    // LOAD ARTICLE
    // -------------------------

    async function loadArticle() {

      if (!slug) {

        document.getElementById("title")
          .textContent =
          "Article not found.";

        return;
      }


      try {

        const response =
          await fetch(
            `/api/articles/${encodeURIComponent(slug)}`
          );


        if (!response.ok) {
          throw new Error(
            "Article not found"
          );
        }


        const article =
          await response.json();


        // Page title
        document.title =
          `${article.title} — The Body Knows What The Mind Feels`;


        // Category
        document.getElementById(
          "category"
        ).textContent =
          article.category || "STORY";


        // Title
        document.getElementById(
          "title"
        ).textContent =
          article.title;


        // Excerpt
        document.getElementById(
          "excerpt"
        ).textContent =
          article.excerpt || "";


        // Date
        document.getElementById(
          "date"
        ).textContent =
          formatDate(
            article.created_at
          );


        // Content
        document.getElementById(
          "content"
        ).innerHTML =
          renderContent(
            article.content
          );


        // Image
        if (article.image_url) {

          const wrapper =
            document.getElementById(
              "imageWrapper"
            );

          const image =
            document.getElementById(
              "featuredImage"
            );


          image.src =
            article.image_url;


          image.alt =
            article.title;


          wrapper.style.display =
            "block";
        }

      } catch (error) {

        console.error(error);

        document.getElementById(
          "title"
        ).textContent =
          "Article not found.";

        document.getElementById(
          "excerpt"
        ).textContent =
          "The article could not be loaded.";

      }

    }


    loadArticle();

  </script>

</body>
</html>
